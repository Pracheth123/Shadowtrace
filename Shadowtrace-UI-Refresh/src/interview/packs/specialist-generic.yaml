pack_id: specialist-generic
title: General specialist round
round: domain_specialist
role_family: generic
# The deepest round, and the one claim interrogation belongs in.
time_budget_s: 720
spine:
  - id: core-work
    text: "Take a piece of work you are known for. Walk me through what it involved."
    competency: practical_application
  - id: hard-call
    text: "What was the hardest judgement call in it, and what were your options?"
    competency: tradeoff_reasoning
  - id: checking
    text: "How did you check your approach was actually working?"
    competency: domain_knowledge
  - id: redo
    text: "What would you do differently now?"
    competency: tradeoff_reasoning
competencies:
  - id: domain_knowledge
    label: Domain knowledge
  - id: practical_application
    label: Practical application
  - id: tradeoff_reasoning
    label: Tradeoff reasoning
probe_policy:
  max_depth: 4
  seconds_per_spine: 110
  min_probe_s: 50
rubric:
  version: specialist.generic.v1
  dimensions:
    - id: domain_knowledge
      label: Domain knowledge
      weight: 0.40
      kind: knowledge
    - id: practical_application
      label: Practical application
      weight: 0.35
      kind: reasoning
    - id: tradeoff_reasoning
      label: Tradeoff reasoning
      weight: 0.25
      kind: reasoning
# GENERIC COVERAGE. This pack is used when the candidate's profession has no
# dedicated specialist pack. It asks real, answer-dependent questions, but it
# cannot reference the vocabulary, failure modes or standards of a specific
# field. The report states this plainly rather than presenting generic coverage
# as expert coverage.
