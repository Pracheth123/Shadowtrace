pack_id: hr-core
title: Recruiter screen
round: hr
# A screen is short on purpose. The budget is the whole round when HR is run
# alone, and a quarter of a Full Interview when it is the first round.
time_budget_s: 420
spine:
  - id: walk-me-through
    text: "Walk me through your background in your own words."
    competency: career_story
  - id: why-this-role
    text: "Why this role, and why now?"
    competency: motivation
  - id: role-understanding
    text: "What do you understand this role to involve day to day?"
    competency: role_understanding
  - id: what-you-want-next
    text: "What are you looking for in your next role that you do not have today?"
    competency: motivation
competencies:
  - id: career_story
    label: Career story
  - id: motivation
    label: Motivation
  - id: role_understanding
    label: Understanding of the role
  - id: communication
    label: Communication
probe_policy:
  # Two levels. A career break pressed four levels deep is an interrogation,
  # not a screen.
  max_depth: 2
  seconds_per_spine: 70
  min_probe_s: 35
rubric:
  version: hr.v1
  dimensions:
    - id: career_story_clarity
      label: Clarity of the career story
      weight: 0.30
      kind: communication
    - id: role_understanding
      label: Understanding of the role
      weight: 0.30
      kind: reasoning
    - id: motivation_relevance
      label: Relevance of stated motivation
      weight: 0.25
      kind: reasoning
    - id: context_consistency
      label: Consistency with supplied background
      weight: 0.15
      kind: evidence
# No technical dimension, and no dimension for career gaps, employment status,
# or practical preferences. Those are discussion context; scoring them would
# penalise circumstance rather than assess preparation.
