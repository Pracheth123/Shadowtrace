pack_id: specialist-sales
title: Sales specialist round
round: domain_specialist
role_family: sales
# The deepest round, and the one claim interrogation belongs in.
time_budget_s: 720
spine:
  - id: qualify
    text: "Walk me through how you qualify an opportunity. Use a real one."
    competency: domain_knowledge
  - id: objection
    text: "Tell me about the toughest objection you have handled, and what you actually said."
    competency: practical_application
  - id: forecast
    text: "How do you forecast, and tell me about a time you were wrong."
    competency: domain_knowledge
  - id: negotiation
    text: "Walk me through a negotiation where you had to hold or give ground."
    competency: tradeoff_reasoning
competencies:
  - id: domain_knowledge
    label: Domain knowledge
  - id: practical_application
    label: Practical application
  - id: tradeoff_reasoning
    label: Tradeoff reasoning
probe_policy:
  max_depth: 4
  seconds_per_spine: 110
  min_probe_s: 50
rubric:
  version: specialist.sales.v1
  dimensions:
    - id: domain_knowledge
      label: Sales knowledge
      weight: 0.40
      kind: knowledge
    - id: practical_application
      label: Deal execution
      weight: 0.35
      kind: reasoning
    - id: tradeoff_reasoning
      label: Qualification and negotiation judgement
      weight: 0.25
      kind: reasoning
