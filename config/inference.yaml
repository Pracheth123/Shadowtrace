# Inference configuration — generation defaults and the TTS vendor only.
#
# Stage 16: everything that also exists as an environment setting was removed
# from this file. It used to carry `requests_per_minute`, `max_retries_on_429`,
# `max_calls_per_turn`, role models and failover models, and the Groq client
# read those *instead of* GROQ_REQUESTS_PER_MINUTE / GROQ_MAX_RETRIES /
# MAX_MODEL_CALLS_PER_TURN / MODEL_* — so changing .env silently did nothing.
#
# The single source for those is now src/interview/config.py (process
# environment > .env > defaults). Secrets never live here.

# Shared generation defaults for the freeform interviewer path (overridable per
# call). Structured calls set their own budgets.
provider: groq                  # groq | mock (freeform stage-4 interviewer only)
max_tokens: 120
temperature: 0.7

# ── TTS (unchanged stage-3 path; Deepgram is configured in .env) ─────────────
tts:
  vendor: mock                  # mock until a TTS vendor is re-benchmarked
  model: tts-1
  voice: nova
  api_key: ""
