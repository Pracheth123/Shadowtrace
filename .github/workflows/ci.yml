# Offline verification only: no provider keys, no network calls to Groq or
# Deepgram, synthetic data, isolated temp storage. Live checks are opt-in and
# billable, and are run by hand (see docs/RELEASE_STATUS.md).
name: ci

on:
  push:
    branches: [main, "roadmap/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend (offline pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Offline test suite
        env:
          GROQ_API_KEY: ""
          DEEPGRAM_API_KEY: ""
        run: python -m pytest -q

  backend-postgres:
    name: Backend on PostgreSQL ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: ci
          POSTGRES_DB: ci_admin
          # Disposable service container; not a real credential.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci_admin" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-postgres.txt
      - name: Install locked dependencies with the PostgreSQL extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt -r requirements-postgres.txt
          python -m pip install -e . --no-deps
      - name: Create the suite database
        env:
          PGPASSWORD: ci-${{ github.run_id }}
        run: psql -h 127.0.0.1 -U ci -d ci_admin -c "CREATE DATABASE ci_suite"
      - name: Offline suite on PostgreSQL (plus real-server storage tests)
        env:
          DATABASE_URL: postgresql://ci:ci-${{ github.run_id }}@127.0.0.1:5432/ci_suite
          TEST_DATABASE_URL: postgresql://ci:ci-${{ github.run_id }}@127.0.0.1:5432/ci_admin
          GROQ_API_KEY: ""
          DEEPGRAM_API_KEY: ""
        run: python -m pytest -q

  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client
      - run: npm run build
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  browser:
    name: Mocked browser journey
    runs-on: ubuntu-latest
    needs: [client]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tools/ui-test/package-lock.json
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Install client (runtime deps) and build
        working-directory: client
        run: |
          npm ci
          npm run build
      - name: Install test-only browser tooling (separate from the app)
        working-directory: tools/ui-test
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Journey against the Vite dev server
        working-directory: tools/ui-test
        env:
          UI_TEST_PYTHON: python
        run: npm test
      - name: Keep dev-mode evidence
        if: always()
        run: mv logs/ui-smoke logs/ui-smoke-dev || true
      - name: Journey against the production build
        working-directory: tools/ui-test
        env:
          UI_TEST_PYTHON: python
          UI_TEST_PRODUCTION: "1"
        run: npm test
      - name: Homepage story (motion, focus, reduced motion)
        working-directory: tools/ui-test
        run: npm run homepage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence-${{ github.sha }}
          path: |
            logs/ui-smoke
            logs/ui-smoke-dev
          retention-days: 14
