pack_id: behavioral-core
title: Behavioral core
time_budget_s: 900
spine:
  - id: own-project
    text: "Tell me about a time you owned a project from start to finish."
    competency: ownership
  - id: disagree-teammate
    text: "Tell me about a time you disagreed with a teammate and what you did."
    competency: collaboration
  - id: incomplete-info
    text: "Tell me about a time you made a decision with incomplete information."
    competency: ambiguity
  - id: missed-mark
    text: "Tell me about a time you missed the mark and what you changed afterward."
    competency: reflection
competencies:
  - id: ownership
    label: Ownership
  - id: collaboration
    label: Collaboration
  - id: ambiguity
    label: Ambiguity
  - id: reflection
    label: Reflection
probe_policy:
  max_depth: 2
  seconds_per_spine: 90
  min_probe_s: 45
scoring_weights:
  technical: 0.25
  structure: 0.25
  delivery: 0.25
  competency: 0.25
# Stage 11 panel roster. Used only when panel mode is on; the voices share one
# guard, so a role only says who speaks and which competency they lean on.
panel:
  - persona: lead
    label: Lead interviewer
    voice: nova
    competency: ownership
  - persona: peer
    label: Peer engineer
    voice: alloy
    competency: collaboration
  - persona: manager
    label: Hiring manager
    voice: onyx
    competency: reflection
