pack_id: specialist-hardware
title: Hardware specialist round
round: domain_specialist
role_family: hardware
# The deepest round, and the one claim interrogation belongs in.
time_budget_s: 720
spine:
  - id: design-choice
    text: "Take a block or board you designed. Walk me through the constraint that drove your choices."
    competency: tradeoff_reasoning
  - id: verification
    text: "How did you verify it worked, and what did your verification not cover?"
    competency: practical_application
  - id: bench-debug
    text: "Tell me about something that failed on the bench. How did you isolate it?"
    competency: practical_application
  - id: interface-tradeoff
    text: "Talk me through an interface or timing tradeoff you had to make."
    competency: domain_knowledge
competencies:
  - id: domain_knowledge
    label: Domain knowledge
  - id: practical_application
    label: Practical application
  - id: tradeoff_reasoning
    label: Tradeoff reasoning
probe_policy:
  max_depth: 4
  seconds_per_spine: 110
  min_probe_s: 50
rubric:
  version: specialist.hardware.v1
  dimensions:
    - id: domain_knowledge
      label: Hardware knowledge
      weight: 0.40
      kind: knowledge
    - id: practical_application
      label: Verification and debugging
      weight: 0.35
      kind: reasoning
    - id: tradeoff_reasoning
      label: Design tradeoffs
      weight: 0.25
      kind: reasoning
