pack_id: specialist-marketing
title: Marketing specialist round
round: domain_specialist
role_family: marketing
# The deepest round, and the one claim interrogation belongs in.
time_budget_s: 720
spine:
  - id: audience
    text: "Take a campaign you ran. Who were you targeting, and who did you deliberately leave out?"
    competency: domain_knowledge
  - id: decision
    text: "What was the biggest call you made on that campaign, and why?"
    competency: tradeoff_reasoning
  - id: measurement
    text: "How did you measure it, and how confident are you in the attribution?"
    competency: practical_application
  - id: constraint
    text: "If the budget had been a tenth of that, what would you have cut?"
    competency: tradeoff_reasoning
competencies:
  - id: domain_knowledge
    label: Domain knowledge
  - id: practical_application
    label: Practical application
  - id: tradeoff_reasoning
    label: Tradeoff reasoning
probe_policy:
  max_depth: 4
  seconds_per_spine: 110
  min_probe_s: 50
rubric:
  version: specialist.marketing.v1
  dimensions:
    - id: domain_knowledge
      label: Marketing knowledge
      weight: 0.40
      kind: knowledge
    - id: practical_application
      label: Campaign execution and measurement
      weight: 0.35
      kind: reasoning
    - id: tradeoff_reasoning
      label: Audience and budget tradeoffs
      weight: 0.25
      kind: reasoning
